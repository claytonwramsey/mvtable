[package]
name = "mvtable"
version = "0.1.0"
edition = "2024"
description = "Multilevel voxel table for fast point cloud collision checking"
license = "MIT OR Apache-2.0"
repository = "https://github.com/claytonwramsey/mvtable"
readme = "../../README.md"
keywords = ["collision-checking", "point-cloud", "robotics", "simd"]
categories = ["algorithms", "no-std", "science::robotics", "data-structures"]
homepage = "https://claytonwramsey.com/blog/mvt"

[dependencies]

[dev-dependencies]
rand = { version = "0.10", default-features = false }

[features]
default = ["std"]
std = []
simd = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
